<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Guia de Treinamento — Hibiscus Beach Club</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --brand:        #2ecc71;
      --brand-dark:   #27ae60;
      --brand-light:  #eafaf1;
      --hero-bg:      #1a7a4a;
      --text:         #1f2937;
      --text-muted:   #6b7280;
      --border:       #e5e7eb;
      --card-bg:      #ffffff;
      --page-bg:      #f3f4f6;
      --tag-bg:       #d1fae5;
      --tag-text:     #065f46;
      --step-line:    #d1fae5;
      --shadow:       0 2px 12px rgba(0,0,0,.08);
      --radius:       14px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --brand:        #34d980;
        --brand-dark:   #2ecc71;
        --brand-light:  #064e2a;
        --hero-bg:      #0d3d22;
        --text:         #f1f5f9;
        --text-muted:   #94a3b8;
        --border:       #334155;
        --card-bg:      #1e293b;
        --page-bg:      #0f172a;
        --tag-bg:       #064e2a;
        --tag-text:     #6ee7b7;
        --step-line:    #134e35;
        --shadow:       0 2px 16px rgba(0,0,0,.3);
      }
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--page-bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── HERO ── */
    .hero {
      background: var(--hero-bg);
      padding: 48px 24px 56px;
      text-align: center;
    }
    .hero-logo {
      height: 44px;
      margin-bottom: 20px;
      opacity: .9;
    }
    .hero h1 {
      color: #fff;
      font-size: clamp(1.4rem, 4vw, 2rem);
      font-weight: 700;
      margin-bottom: 8px;
    }
    .hero p {
      color: rgba(255,255,255,.75);
      font-size: .95rem;
      margin-bottom: 28px;
    }
    .search-wrap {
      max-width: 540px;
      margin: 0 auto;
      position: relative;
    }
    .search-wrap svg {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: #9ca3af;
      pointer-events: none;
    }
    #busca {
      width: 100%;
      padding: 14px 16px 14px 46px;
      border: none;
      border-radius: 50px;
      font-size: 1rem;
      background: #fff;
      color: #1f2937;
      outline: none;
      box-shadow: 0 4px 20px rgba(0,0,0,.2);
    }
    #busca::placeholder { color: #9ca3af; }

    /* ── GRID DE CARDS ── */
    .cards-section {
      max-width: 960px;
      margin: 0 auto;
      padding: 40px 20px 16px;
    }
    .cards-section h2 {
      font-size: .75rem;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 16px;
    }
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px 20px 20px;
      cursor: pointer;
      transition: box-shadow .15s, transform .15s;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .card:hover {
      box-shadow: 0 6px 24px rgba(0,0,0,.13);
      transform: translateY(-2px);
    }
    .card-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: var(--brand-light);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
    }
    .card h3 {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text);
    }
    .card p {
      font-size: .85rem;
      color: var(--text-muted);
      line-height: 1.5;
    }
    .card-tag {
      display: inline-block;
      font-size: .7rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 20px;
      background: var(--tag-bg);
      color: var(--tag-text);
      margin-top: 4px;
      align-self: flex-start;
    }

    /* ── DETALHE DA SEÇÃO ── */
    #detalhe {
      display: none;
      max-width: 720px;
      margin: 0 auto 48px;
      padding: 32px 20px 0;
    }
    #detalhe.visible { display: block; }

    .detalhe-voltar {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--brand-dark);
      font-size: .875rem;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 24px;
      background: none;
      border: none;
      padding: 0;
    }
    .detalhe-voltar:hover { text-decoration: underline; }

    .detalhe-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 24px;
    }
    .detalhe-icon {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: var(--brand-light);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      flex-shrink: 0;
    }
    .detalhe-header h2 { font-size: 1.4rem; font-weight: 700; }
    .detalhe-header p  { font-size: .9rem; color: var(--text-muted); margin-top: 2px; }

    .screenshot-wrap {
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
      box-shadow: 0 4px 20px rgba(0,0,0,.1);
      margin-bottom: 28px;
    }
    .screenshot-wrap img { width: 100%; display: block; height: auto; }

    .passos-titulo {
      font-size: .75rem;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 16px;
    }
    .passos { display: flex; flex-direction: column; }
    .passo {
      display: flex;
      gap: 14px;
      padding-bottom: 20px;
      position: relative;
    }
    .passo:not(:last-child)::after {
      content: '';
      position: absolute;
      left: 15px;
      top: 32px;
      bottom: 0;
      width: 2px;
      background: var(--step-line);
    }
    .passo-num {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--brand);
      color: #fff;
      font-size: .8rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      position: relative;
      z-index: 1;
    }
    .passo-texto {
      padding-top: 6px;
      font-size: .9rem;
      line-height: 1.6;
      color: var(--text);
    }

    .dica-box {
      background: var(--brand-light);
      border-left: 4px solid var(--brand);
      border-radius: 8px;
      padding: 14px 16px;
      font-size: .85rem;
      color: var(--text);
      line-height: 1.6;
      margin-top: 24px;
    }

    /* ── BUSCA SEM RESULTADO ── */
    .empty-state {
      text-align: center;
      padding: 48px 20px;
      color: var(--text-muted);
      display: none;
    }
    .empty-state.visible { display: block; }
    .empty-state svg { margin-bottom: 12px; opacity: .4; }

    /* ── RODAPÉ ── */
    footer {
      text-align: center;
      padding: 24px;
      font-size: .75rem;
      color: var(--text-muted);
      border-top: 1px solid var(--border);
      margin-top: 24px;
    }
  </style>
</head>
<body>

<!-- ── HERO ── -->

  <div class="search-wrap">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">

<!-- ── GRID ── -->
<div class="cards-section" id="cards-section">

  <div class="empty-state" id="empty-state">
    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">

<!-- ── DETALHE ── -->

  <button class="detalhe-voltar" onclick="voltarCards()">

      <path d="M19 12H5M12 5l-7 7 7 7"/>
    </svg>
    Voltar para todas as seções
  </button>
  <div id="detalhe-content"></div>
</div>

<footer>
  Dashboard Integrado Hibiscus Beach Club &nbsp;·&nbsp; Desenvolvido por <strong>H8 Publicis</strong>
</footer>

<script>
  function renderCards(lista) {
    const grid  = document.getElementById('cards-grid');
    const empty = document.getElementById('empty-state');
    grid.innerHTML = '';
    if (lista.length === 0) {
      empty.classList.add('visible');
      document.getElementById('empty-query').textContent = document.getElementById('busca').value;
      return;
    }
    empty.classList.remove('visible');
    lista.forEach(s => {
      const card = document.createElement('div');
      card.className = 'card';
      card.onclick = () => abrirSecao(s.id);
      card.innerHTML =
        '<div class="card-icon">' + s.emoji + '</div>' +
        '<h3>' + s.titulo + '</h3>' +
        '<p>' + s.descricao + '</p>' +
        '<span class="card-tag">' + s.tag + '</span>';
      grid.appendChild(card);
    });
  }

  function abrirSecao(id) {
    const s = SECOES.find(x => x.id === id);
    if (!s) return;
    document.getElementById('cards-section').style.display = 'none';
    const det = document.getElementById('detalhe');
    det.classList.add('visible');
    const passosHTML = s.passos.map((p, i) =>
      '<div class="passo">' +
        '<div class="passo-num">' + (i + 1) + '</div>' +
        '<div class="passo-texto">' + p + '</div>' +
      '</div>'
    ).join('');
    document.getElementById('detalhe-content').innerHTML =
      '<div class="detalhe-header">' +
        '<div class="detalhe-icon">' + s.emoji + '</div>' +
        '<div><h2>' + s.titulo + '</h2><p>' + s.descricao + '</p></div>' +
      '</div>' +
      '<p class="passos-titulo">Passo a passo</p>' +
      '<div class="passos">' + passosHTML + '</div>' +
      (s.dica ? '<div class="dica-box">' + s.dica + '</div>' : '');
    det.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function voltarCards() {
    document.getElementById('cards-section').style.display = '';
    const det = document.getElementById('detalhe');
    det.classList.remove('visible');
    document.getElementById('detalhe-content').innerHTML = '';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  document.getElementById('busca').addEventListener('input', function () {
    const q = this.value.toLowerCase().trim();
    if (!q) { renderCards(SECOES); return; }
    renderCards(SECOES.filter(s =>
      s.titulo.toLowerCase().includes(q) ||
      s.descricao.toLowerCase().includes(q) ||
      s.tag.toLowerCase().includes(q) ||
      s.passos.some(p => p.toLowerCase().includes(q))
    ));
  });

  renderCards(SECOES);
</script>
</body>
</html>
